
services:
  bills-resort-mysql:
    image: mysql:8.0
    container_name: bills-resort-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - bills-resort-db-data:/var/lib/mysql
    networks:
      - bills-resort-network

  bills-resort-phpmyadmin:
    image: phpmyadmin
    container_name: bills-resort-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: bills-resort-mysql
    ports:
      - "8080:80"
    depends_on:
      - bills-resort-mysql
    networks:
      - bills-resort-network

volumes:
  bills-resort-db-data:

networks:
  bills-resort-network:
    
    
