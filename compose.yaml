services:
  webdev_a_mysql: 
    image: mysql:8.0
    container_name: webdev_trial_mysql 
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - webdev_ab_db_data:/var/lib/mysql
    networks:
      - webdev_a_network

  webdev_a_phpmyadmin:
    image: phpmyadmin
    container_name: webdev_ab_phpmyadmin  
    restart: unless-stopped
    environment:
      PMA_HOST: webdev_trial_mysql
    ports:
      - "8080:80"
    networks:
      - webdev_a_network
    
      

volumes:
  webdev_ab_db_data:

networks:
  webdev_a_network: